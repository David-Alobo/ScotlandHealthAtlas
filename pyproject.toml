[project]
name = "scotland-health-atlas"
version = "0.1.0"
description = "An open atlas of health in Scotland, built from Public Health Scotland and NRS open data"
readme = "README.md"
authors = [{ name = "David Obeh Alobo", email = "david.alobo@monstrous.com.ng" }]
requires-python = ">=3.12"
# pinned to the versions the saved results were made with
dependencies = [
    "duckdb==2.0.0",
    "matplotlib==3.11.2",
    "numpy==2.1.0",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
